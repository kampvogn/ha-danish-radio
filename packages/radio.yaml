    - id: radio_opdater_metadata_oftere_ved_afspilning
      alias: "Radio: opdater metadata oftere ved afspilning"
      mode: single
      triggers:
        - trigger: time_pattern
          seconds: "/10"
      conditions:
        - condition: template
          value_template: >
            {{
              (is_state('input_boolean.radio_afspiller_kokken', 'on') and is_state('media_player.kokken', 'playing'))
              or (is_state('input_boolean.radio_afspiller_sovevaerelse', 'on') and is_state('media_player.sovevaerelse', 'playing'))
              or (is_state('input_boolean.radio_afspiller_unnamed_room', 'on') and is_state('media_player.unnamed_room', 'playing'))
              or (is_state('input_boolean.radio_afspiller_terasse', 'on') and is_state('media_player.terasse', 'playing'))
              or (is_state('input_boolean.radio_afspiller_samsungen', 'on') and is_state('media_player.tv_samsungen', 'playing'))
              or (is_state('input_boolean.radio_afspiller_stue_chromecast', 'on') and is_state('media_player.stue_chromecast', 'playing'))
              or (
                not (
                  is_state('input_boolean.radio_afspiller_kokken', 'on')
                  or is_state('input_boolean.radio_afspiller_sovevaerelse', 'on')
                  or is_state('input_boolean.radio_afspiller_unnamed_room', 'on')
                  or is_state('input_boolean.radio_afspiller_terasse', 'on')
                  or is_state('input_boolean.radio_afspiller_samsungen', 'on')
                  or is_state('input_boolean.radio_afspiller_stue_chromecast', 'on')
                )
                and states(states('input_select.radio_afspiller')) == 'playing'
              )
            }}
      actions:
        - action: homeassistant.update_entity
          target:
            entity_id: >
              {{
                {
                  'DR P3': 'sensor.dr_p3_nu_spiller',
                  'DR P4': 'sensor.dr_p4_ostjylland_nu_spiller',
                  'Nova': 'sensor.nova_nu_spiller'
                }.get(states('input_select.radio_station'), 'sensor.dr_p3_nu_spiller')
              }}
