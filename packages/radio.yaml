# Radio-app til Home Assistant.
#
# Kortet på dashboardet er en fjernbetjening: vælg en afspiller, og vælg en
# station til den. Hver afspiller husker sin egen station, så flere
# afspillere kan spille samtidig, også forskellige stationer.
#
# Afspillere og stationer defineres ét sted: sensor.radio_konfiguration
# (nederst under template). Tilføj en afspiller dér og i
# input_select.radio_afspiller; en station dér og i input_select.radio_station.
radio:
  input_select:
    radio_afspiller:
      name: "Radio - afspiller"
      icon: mdi:speaker
      options:
        - Køkken
        - Soveværelse
        - Unnamed Room
        - Terrasse
        - Samsungen
        - Stue Chromecast

    radio_station:
      name: "Radio - station"
      icon: mdi:radio
      options:
        - DR P3
        - DR P4
        - Nova

  input_number:
    radio_volume:
      name: "Radio - volumen"
      icon: mdi:volume-high
      min: 0
      max: 100
      step: 1
      mode: slider
      unit_of_measurement: "%"

  input_text:
    # JSON: {"media_player.x": "DR P3", ...} - hvilken station hver afspiller
    # sidst fik. Bruges til at vise afspillerens station, når den vælges.
    radio_afspiller_stationer:
      name: "Radio - stationer pr. afspiller"
      icon: mdi:code-json
      max: 255
    # JSON: {"media_player.x": "dk.tv2.tv2playtv", ...} - den app, der kørte på
    # afspillerens fjernbetjening (Android TV), før radioen blev castet dertil.
    radio_forrige_app:
      name: "Radio - app før radio pr. afspiller"
      icon: mdi:code-json
      max: 255

  # "Nu spiller"-sensorer fra integrationen custom_components/danish_radio
  # (sensor.dr_p3_nu_spiller, sensor.dr_p4_ostjylland_nu_spiller,
  # sensor.nova_nu_spiller).
  danish_radio:
    stations:
      - dr_p3
      - dr_p4_oestjylland
      - nova

  command_line:
    - sensor:
        name: "DR P3 webcam stream"
        unique_id: dr_p3_webcam_stream
        icon: mdi:video
        command: "python3 /config/scripts/dr_icy_now_playing.py p3webcam"
        scan_interval: 21600
        value_template: "{{ value_json.state }}"
        json_attributes:
          - source
          - updated_at

  template:
    - sensor:
        - name: "Radio konfiguration"
          unique_id: radio_konfiguration
          icon: mdi:cog
          state: "ok"
          attributes:
            # Navn i dropdown -> media_player
            afspillere: >-
              {{ {
                'Køkken': 'media_player.kokken',
                'Soveværelse': 'media_player.sovevaerelse',
                'Unnamed Room': 'media_player.unnamed_room',
                'Terrasse': 'media_player.terasse',
                'Samsungen': 'media_player.tv_samsungen',
                'Stue Chromecast': 'media_player.stue_chromecast'
              } }}
            # Fjernsyn: DR P3 spilles som video fra studiet (HLS med lyd).
            tv: "{{ ['media_player.tv_samsungen', 'media_player.stue_chromecast'] }}"
            # Valgfrit: afspiller -> remote-entity (fx fra Android TV Remote-
            # integrationen på en Chromecast med Google TV). Kortet viser kun
            # knappen "Hjemmeskærm", når den valgte afspiller har en remote,
            # der findes og er tilgængelig. Lad den være {} uden sådan en.
            fjernbetjeninger: >-
              {{ {
                'media_player.stue_chromecast': 'remote.stue_google_tv'
              } }}
            # Pænt navn på Android TV-apps i "Tilbage til"-knappen. Ukendte apps
            # vises med pakkenavnet.
            appnavne: >-
              {{ {
                'dk.tv2.tv2playtv': 'TV 2 Play',
                'com.google.android.youtube.tv': 'YouTube',
                'com.netflix.ninja': 'Netflix',
                'com.disney.disneyplus': 'Disney+',
                'com.amazon.amazonvideo.livingroom': 'Prime Video'
              } }}
            # Apps, der ikke skal huskes: cast-modtageren og hjemmeskærmen.
            ikke_apps: "{{ ['com.google.android.apps.mediashell', 'com.google.android.apps.tv.launcherx', 'com.google.android.tvlauncher'] }}"
            # match: tekst i afspillerens media_content_id, der viser, at
            # stationen (stadig) spiller.
            stationer: >-
              {{ {
                'DR P3': {
                  'titel': 'DR P3',
                  'url': 'http://live-icy.gslb01.dr.dk/A/A05H.mp3',
                  'logo': 'https://www.dr.dk/lyd/_next/static/media/p3.28743ad0.svg',
                  'sensor': 'sensor.dr_p3_nu_spiller',
                  'match': ['A05H', 'p3webcam']
                },
                'DR P4': {
                  'titel': 'DR P4 Østjylland',
                  'url': 'http://live-icy.gslb01.dr.dk/A/A14H.mp3',
                  'logo': 'https://www.dr.dk/lyd/_next/static/media/p4.a9a465ed.svg',
                  'sensor': 'sensor.dr_p4_ostjylland_nu_spiller',
                  'match': ['A14H']
                },
                'Nova': {
                  'titel': 'Nova',
                  'url': 'http://live-bauerdk.sharp-stream.com/nova128.mp3',
                  'logo': 'https://assets.planetradio.co.uk/img/ConfigWebListenBarLogoImageUrl/174.jpg?ver=1490690222',
                  'sensor': 'sensor.nova_nu_spiller',
                  'match': ['nova']
                }
              } }}

        - name: "Radio valgt afspiller"
          unique_id: radio_valgt_afspiller
          icon: mdi:speaker
          state: >-
            {{ (state_attr('sensor.radio_konfiguration', 'afspillere') or {})
               .get(states('input_select.radio_afspiller'), 'unknown') }}
          attributes:
            volume: >-
              {% set e = (state_attr('sensor.radio_konfiguration', 'afspillere') or {})
                         .get(states('input_select.radio_afspiller')) %}
              {{ state_attr(e, 'volume_level') if e else none }}
            # Afspillerens remote-entity, hvis den er sat op og tilgængelig, ellers none.
            fjernbetjening: >-
              {% set e = (state_attr('sensor.radio_konfiguration', 'afspillere') or {})
                         .get(states('input_select.radio_afspiller')) %}
              {% set r = (state_attr('sensor.radio_konfiguration', 'fjernbetjeninger') or {}).get(e) %}
              {{ r if r and states(r) not in ['unknown', 'unavailable'] else none }}
            # App, der kørte før radioen startede, eller none (så går knappen til
            # hjemmeskærmen).
            forrige_app: >-
              {{ (states('input_text.radio_forrige_app') | from_json(default={}))
                 .get(states('sensor.radio_valgt_afspiller')) }}

        - name: "Radio valgt station info"
          unique_id: radio_valgt_station_info
          icon: mdi:radio
          state: >-
            {% set valgt = states('input_select.radio_station') %}
            {% set st = (state_attr('sensor.radio_konfiguration', 'stationer') or {}).get(valgt) %}
            {% if st %}
              {% set kanal = state_attr(st.sensor, 'station') or st.titel %}
              {% set program = state_attr(st.sensor, 'program') %}
              {% set titel = state_attr(st.sensor, 'stream_title') %}
              {{ (kanal ~ (' - ' ~ program if program else '') ~ (': ' ~ titel if titel else ''))[:255] }}
            {% else %}
              {{ valgt }}
            {% endif %}
          attributes:
            station: >-
              {% set valgt = states('input_select.radio_station') %}
              {% set st = (state_attr('sensor.radio_konfiguration', 'stationer') or {}).get(valgt) %}
              {{ (state_attr(st.sensor, 'station') or st.titel) if st else valgt }}
            program: >-
              {% set st = (state_attr('sensor.radio_konfiguration', 'stationer') or {}).get(states('input_select.radio_station')) %}
              {{ state_attr(st.sensor, 'program') if st else '' }}
            artist: >-
              {% set st = (state_attr('sensor.radio_konfiguration', 'stationer') or {}).get(states('input_select.radio_station')) %}
              {{ state_attr(st.sensor, 'artist') if st else '' }}
            title: >-
              {% set st = (state_attr('sensor.radio_konfiguration', 'stationer') or {}).get(states('input_select.radio_station')) %}
              {{ state_attr(st.sensor, 'title') if st else '' }}
            stream_title: >-
              {% set st = (state_attr('sensor.radio_konfiguration', 'stationer') or {}).get(states('input_select.radio_station')) %}
              {{ state_attr(st.sensor, 'stream_title') if st else '' }}

        # Antal afspillere, der spiller radio lige nu; attributten afspillere
        # har én række pr. afspiller (navn, entity, station, info).
        - name: "Radio spiller nu"
          unique_id: radio_spiller_nu
          icon: mdi:radio-tower
          state: >-
            {% set afspillere = state_attr('sensor.radio_konfiguration', 'afspillere') or {} %}
            {% set stationer = state_attr('sensor.radio_konfiguration', 'stationer') or {} %}
            {% set gemt = states('input_text.radio_afspiller_stationer') | from_json(default={}) %}
            {% set ns = namespace(ud=[]) %}
            {% for navn, e in afspillere.items() %}
              {% set station = gemt.get(e) %}
              {% set st = stationer.get(station) %}
              {% set cid = state_attr(e, 'media_content_id') or '' %}
              {% if is_state(e, 'playing') and st
                    and (cid == '' or st.match | select('in', cid) | list | count > 0) %}
                {% set titel = state_attr(st.sensor, 'stream_title') or state_attr(st.sensor, 'program') or '' %}
                {% set ns.ud = ns.ud + [{'navn': navn, 'entity_id': e, 'station': station, 'info': titel}] %}
              {% endif %}
            {% endfor %}
            {{ ns.ud | count }}
          attributes:
            afspillere: >-
              {% set afspillere = state_attr('sensor.radio_konfiguration', 'afspillere') or {} %}
              {% set stationer = state_attr('sensor.radio_konfiguration', 'stationer') or {} %}
              {% set gemt = states('input_text.radio_afspiller_stationer') | from_json(default={}) %}
              {% set ns = namespace(ud=[]) %}
              {% for navn, e in afspillere.items() %}
                {% set station = gemt.get(e) %}
                {% set st = stationer.get(station) %}
                {% set cid = state_attr(e, 'media_content_id') or '' %}
                {% if is_state(e, 'playing') and st
                      and (cid == '' or st.match | select('in', cid) | list | count > 0) %}
                  {% set titel = state_attr(st.sensor, 'stream_title') or state_attr(st.sensor, 'program') or '' %}
                  {% set ns.ud = ns.ud + [{'navn': navn, 'entity_id': e, 'station': station, 'info': titel}] %}
                {% endif %}
              {% endfor %}
              {{ ns.ud }}

    - sensor:
        - name: "Radio valgt afspiller tilbage til"
          unique_id: radio_valgt_afspiller_tilbage_til
          icon: mdi:television-play
          state: >-
            {% set app = state_attr('sensor.radio_valgt_afspiller', 'forrige_app') %}
            {% if app %}
              {{ (state_attr('sensor.radio_konfiguration', 'appnavne') or {}).get(app, app) }}
            {% else %}
              Hjemmeskærm
            {% endif %}

    - binary_sensor:
        # Til dashboardet: vis kun "Hjemmeskærm", når den valgte afspiller har
        # en tilgængelig fjernbetjening.
        - name: "Radio valgt afspiller har fjernbetjening"
          unique_id: radio_valgt_afspiller_har_fjernbetjening
          icon: mdi:remote-tv
          state: "{{ state_attr('sensor.radio_valgt_afspiller', 'fjernbetjening') is string }}"

        - name: "Radio valgt afspiller mutet"
          unique_id: radio_valgt_afspiller_muted
          icon: >-
            {{ 'mdi:volume-mute' if state_attr(states('sensor.radio_valgt_afspiller'), 'is_volume_muted') | bool(false) else 'mdi:volume-high' }}
          state: >-
            {{ state_attr(states('sensor.radio_valgt_afspiller'), 'is_volume_muted') | bool(false) }}

        - name: "Radio valgt afspiller spiller"
          unique_id: radio_valgt_afspiller_spiller
          icon: >-
            {{ 'mdi:pause' if is_state(states('sensor.radio_valgt_afspiller'), 'playing') else 'mdi:play' }}
          state: >-
            {{ is_state(states('sensor.radio_valgt_afspiller'), 'playing') }}

  script:
    radio_spil_station:
      alias: "Radio: spil station"
      description: "Spiller en radiostation på en media player og husker valget"
      # parallel: flere afspillere kan startes samtidig uden at afbryde hinanden.
      mode: parallel
      max: 20
      fields:
        afspiller:
          name: Afspiller
          required: true
          selector:
            entity:
              domain: media_player
        station:
          name: Station
          required: true
          selector:
            select:
              options:
                - DR P3
                - DR P4
                - Nova
      variables:
        stationer: "{{ state_attr('sensor.radio_konfiguration', 'stationer') or {} }}"
        valgt_station: "{{ stationer.get(station) or stationer.get('DR P3') }}"
        station_navn: "{{ station if station in stationer else 'DR P3' }}"
        p3_video_url: >-
          {% set u = states('sensor.dr_p3_webcam_stream') %}
          {{ u if u.startswith('https://') else
             'https://drp3webcamhls.akamaized.net/hls/live/20003007/p3webcam/mastervg.m3u8' }}
        video: >-
          {{ station_navn == 'DR P3'
             and afspiller in (state_attr('sensor.radio_konfiguration', 'tv') or []) }}
      sequence:
        # Husk appen på afspillerens fjernbetjening (fx TV 2 Play), så knappen
        # "Tilbage til" kan åbne den igen. Kører radioen allerede, er appen
        # cast-modtageren, og den gemte app bevares.
        - variables:
            fjernbetjening: >-
              {% set r = (state_attr('sensor.radio_konfiguration', 'fjernbetjeninger') or {}).get(afspiller) %}
              {{ r if r and states(r) not in ['unknown', 'unavailable'] else '' }}
            app: "{{ state_attr(fjernbetjening, 'current_activity') if fjernbetjening else '' }}"
        - if:
            - condition: template
              value_template: >-
                {{ fjernbetjening != '' and states(fjernbetjening) == 'on'
                   and app is string and app != ''
                   and app not in (state_attr('sensor.radio_konfiguration', 'ikke_apps') or []) }}
          then:
            - action: input_text.set_value
              target:
                entity_id: input_text.radio_forrige_app
              data:
                value: >-
                  {% set gemt = states('input_text.radio_forrige_app') | from_json(default={}) %}
                  {{ dict(gemt.items() | list + [(afspiller, app)]) | to_json }}
          else:
            - if:
                - condition: template
                  value_template: >-
                    {{ fjernbetjening != '' and app in (state_attr('sensor.radio_konfiguration', 'ikke_apps') or [])
                       and app != 'com.google.android.apps.mediashell' }}
              then:
                # Startet fra hjemmeskærmen: glem en gammel app.
                - action: input_text.set_value
                  target:
                    entity_id: input_text.radio_forrige_app
                  data:
                    value: >-
                      {% set gemt = states('input_text.radio_forrige_app') | from_json(default={}) %}
                      {{ dict(gemt.items() | rejectattr(0, 'eq', afspiller) | list) | to_json }}
        - action: input_text.set_value
          target:
            entity_id: input_text.radio_afspiller_stationer
          data:
            value: >-
              {% set gemt = states('input_text.radio_afspiller_stationer') | from_json(default={}) %}
              {{ dict(gemt.items() | list + [(afspiller, station_navn)]) | to_json }}
        - action: media_player.play_media
          target:
            entity_id: "{{ afspiller }}"
          data:
            media:
              media_content_id: "{{ p3_video_url if video else valgt_station.url }}"
              media_content_type: "{{ 'application/x-mpegurl' if video else 'music' }}"
              metadata:
                title: "{{ valgt_station.titel }}"
                thumbnail: "{{ valgt_station.logo }}"
                media_class: "{{ 'video' if video else 'music' }}"

    radio_spil_dr_p3:
      alias: "Radio: spil DR P3"
      description: "Spiller DR P3 på en valgt media player"
      mode: parallel
      fields:
        afspiller:
          name: Afspiller
          required: true
          selector:
            entity:
              domain: media_player
      sequence:
        - action: script.radio_spil_station
          data:
            afspiller: "{{ afspiller }}"
            station: DR P3

    radio_spil_valgt:
      alias: "Radio: spil valgt station på valgt afspiller"
      mode: restart
      sequence:
        - condition: template
          value_template: "{{ states('sensor.radio_valgt_afspiller').startswith('media_player.') }}"
        - action: script.radio_spil_station
          data:
            afspiller: "{{ states('sensor.radio_valgt_afspiller') }}"
            station: "{{ states('input_select.radio_station') }}"

    radio_toggle_valgt:
      alias: "Radio: skift play/pause på valgt afspiller"
      mode: restart
      sequence:
        - if:
            - condition: template
              value_template: "{{ is_state(states('sensor.radio_valgt_afspiller'), 'playing') }}"
          then:
            - action: script.radio_pause_valgt
          else:
            - action: script.radio_spil_valgt

    radio_pause_valgt:
      alias: "Radio: pause valgt afspiller"
      description: "Pauser valgt afspiller, og stopper den, hvis pause ikke understøttes"
      mode: restart
      variables:
        afspiller: "{{ states('sensor.radio_valgt_afspiller') }}"
      sequence:
        - condition: template
          value_template: "{{ afspiller.startswith('media_player.') }}"
        - action: media_player.media_pause
          target:
            entity_id: "{{ afspiller }}"
          continue_on_error: true
        - delay:
            seconds: 1
        - if:
            - condition: template
              value_template: "{{ is_state(afspiller, 'playing') }}"
          then:
            - action: media_player.media_stop
              target:
                entity_id: "{{ afspiller }}"

    radio_stop_valgt:
      alias: "Radio: stop valgt afspiller"
      mode: restart
      sequence:
        - condition: template
          value_template: "{{ states('sensor.radio_valgt_afspiller').startswith('media_player.') }}"
        - action: media_player.media_stop
          target:
            entity_id: "{{ states('sensor.radio_valgt_afspiller') }}"

    radio_stop_alle:
      alias: "Radio: stop alle"
      description: "Stopper alle afspillere, der spiller radio"
      mode: restart
      variables:
        afspillere: >-
          {{ state_attr('sensor.radio_spiller_nu', 'afspillere') | default([], true)
             | map(attribute='entity_id') | list }}
      sequence:
        - condition: template
          value_template: "{{ afspillere | count > 0 }}"
        - action: media_player.media_stop
          target:
            entity_id: "{{ afspillere }}"
          continue_on_error: true

    radio_hjem_valgt:
      alias: "Radio: valgt afspiller tilbage til forrige app"
      description: >-
        Lukker cast-appen og åbner den app, der kørte før radioen (eller
        hjemmeskærmen) via afspillerens fjernbetjening (se fjernbetjeninger i
        sensor.radio_konfiguration).
      mode: single
      variables:
        afspiller: "{{ states('sensor.radio_valgt_afspiller') }}"
        fjernbetjening: "{{ state_attr('sensor.radio_valgt_afspiller', 'fjernbetjening') }}"
        app: "{{ state_attr('sensor.radio_valgt_afspiller', 'forrige_app') or '' }}"
      sequence:
        - condition: template
          value_template: "{{ fjernbetjening is string and fjernbetjening.startswith('remote.') }}"
        - if:
            - condition: template
              value_template: "{{ states(afspiller) not in ['off', 'unavailable', 'unknown'] }}"
          then:
            - action: media_player.turn_off
              target:
                entity_id: "{{ afspiller }}"
              continue_on_error: true
        - if:
            - condition: template
              value_template: "{{ app != '' }}"
          then:
            - action: remote.turn_on
              target:
                entity_id: "{{ fjernbetjening }}"
              data:
                activity: "{{ app }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.radio_forrige_app
              data:
                value: >-
                  {% set gemt = states('input_text.radio_forrige_app') | from_json(default={}) %}
                  {{ dict(gemt.items() | rejectattr(0, 'eq', afspiller) | list) | to_json }}
          else:
            - action: remote.send_command
              target:
                entity_id: "{{ fjernbetjening }}"
              data:
                command: HOME

    radio_mute_valgt:
      alias: "Radio: mute valgt afspiller"
      mode: single
      sequence:
        - action: media_player.volume_mute
          target:
            entity_id: "{{ states('sensor.radio_valgt_afspiller') }}"
          data:
            is_volume_muted: >-
              {{ not (state_attr(states('sensor.radio_valgt_afspiller'), 'is_volume_muted') | bool(false)) }}

  automation:
    # Vælg en station = spil den på den valgte afspiller. Når dropdownen kun
    # ændres, fordi en anden afspiller blev valgt (se næste automation), er
    # stationen allerede afspillerens, og der sker ikke mere.
    - id: radio_spil_valgt_station_ved_dropdown_skift
      alias: "Radio: spil valgt station når dropdown ændres"
      mode: restart
      triggers:
        - trigger: state
          entity_id: input_select.radio_station
      conditions:
        - condition: template
          value_template: >-
            {% set e = states('sensor.radio_valgt_afspiller') %}
            {% set gemt = states('input_text.radio_afspiller_stationer') | from_json(default={}) %}
            {{ trigger.from_state is not none
               and trigger.to_state is not none
               and trigger.from_state.state not in ['unknown', 'unavailable']
               and trigger.to_state.state not in ['unknown', 'unavailable']
               and e.startswith('media_player.')
               and gemt.get(e) != trigger.to_state.state }}
      actions:
        - action: script.radio_spil_valgt

    # Vælg en afspiller = vis den station, den sidst fik.
    - id: radio_vis_station_for_valgt_afspiller
      alias: "Radio: vis station for valgt afspiller"
      mode: restart
      triggers:
        - trigger: state
          entity_id: sensor.radio_valgt_afspiller
      conditions:
        - condition: template
          value_template: >-
            {% set gemt = states('input_text.radio_afspiller_stationer') | from_json(default={}) %}
            {% set st = gemt.get(trigger.to_state.state) %}
            {{ st is not none
               and st in state_attr('input_select.radio_station', 'options')
               and st != states('input_select.radio_station') }}
      actions:
        - action: input_select.select_option
          target:
            entity_id: input_select.radio_station
          data:
            option: >-
              {{ (states('input_text.radio_afspiller_stationer') | from_json(default={})).get(trigger.to_state.state) }}

    - id: radio_sync_volume_to_selected_player
      alias: "Radio: synkroniser lydstyrke fra valgt afspiller"
      mode: restart
      triggers:
        - trigger: state
          entity_id: sensor.radio_valgt_afspiller
        - trigger: state
          entity_id: sensor.radio_valgt_afspiller
          attribute: volume
      conditions:
        - condition: template
          value_template: "{{ state_attr('sensor.radio_valgt_afspiller', 'volume') is number }}"
      actions:
        - action: input_number.set_value
          target:
            entity_id: input_number.radio_volume
          data:
            value: "{{ (state_attr('sensor.radio_valgt_afspiller', 'volume') * 100) | round(0) }}"

    - id: radio_set_volume_on_selected_player
      alias: "Radio: indstil lydstyrke på valgt afspiller"
      mode: restart
      triggers:
        - trigger: state
          entity_id: input_number.radio_volume
      conditions:
        - condition: template
          value_template: >-
            {% set v = state_attr('sensor.radio_valgt_afspiller', 'volume') %}
            {{ states('sensor.radio_valgt_afspiller').startswith('media_player.')
               and (v is not number or (v * 100) | round(0) != states('input_number.radio_volume') | float(0)) }}
      actions:
        - action: media_player.volume_set
          target:
            entity_id: "{{ states('sensor.radio_valgt_afspiller') }}"
          data:
            volume_level: "{{ states('input_number.radio_volume') | float(0) / 100 }}"

    # Opdater "nu spiller" hvert 10. sekund for de stationer, der spiller.
    - id: radio_opdater_metadata_oftere_ved_afspilning
      alias: "Radio: opdater metadata oftere ved afspilning"
      mode: single
      triggers:
        - trigger: time_pattern
          seconds: "/10"
      variables:
        sensorer: >-
          {% set stationer = state_attr('sensor.radio_konfiguration', 'stationer') or {} %}
          {% set ns = namespace(s=[]) %}
          {% for r in state_attr('sensor.radio_spiller_nu', 'afspillere') | default([], true) %}
            {% if r.station in stationer %}
              {% set ns.s = ns.s + [stationer[r.station].sensor] %}
            {% endif %}
          {% endfor %}
          {{ ns.s | unique | list }}
      conditions:
        - condition: template
          value_template: "{{ sensorer | count > 0 }}"
      actions:
        - action: homeassistant.update_entity
          target:
            entity_id: "{{ sensorer }}"
